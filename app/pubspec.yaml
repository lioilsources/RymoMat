name: rymomat
description: "RymoMat: poem editor with live rhyme suggestions."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  path: ^1.9.1
  archive: ^4.0.7
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  share_plus: ^12.0.1
  file_selector: ^1.0.3
  rymo_core:
    path: ../packages/rymo_core
  rymo_editor:
    path: ../packages/rymo_editor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    # cs rhyme pack, `run/rymo release cs` → work/release/cs-v1.zip (gitignored,
    # CI fetches it from the rymomat-packs release). Extracted on first launch.
    - assets/packs/

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#29335C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
